<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG template — MBA India Daily</title>
<!-- Same pairing as the site. When run locally with network access the real
     fonts load; offline it falls back to Georgia/Arial equivalents. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Instrument+Serif:ital@1&display=swap">
<style>
  :root{
    --paper:#F7F5EF; --paper-raised:#EDEAE0; --ink:#171614;
    --ink-muted:#6B675E; --accent:#B4231F; --line:#D8D4C8;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:var(--paper); font-family:'Archivo', Arial, sans-serif; color:var(--ink); }
  em{ font-family:'Instrument Serif', Georgia, serif; font-style:italic; font-weight:400; color:var(--accent); }

  .card{
    position:relative; overflow:hidden;
    display:flex; flex-direction:column; justify-content:space-between;
    border:3px solid var(--ink); outline:24px solid var(--paper);
  }
  .og   .card{ width:1200px; height:630px;  padding:64px 72px; }
  .sq   .card{ width:1080px; height:1080px; padding:80px 84px; }
  .icon .card{ width:180px;  height:180px;  border-width:10px; padding:0;
               align-items:center; justify-content:center; }

  .rule{ height:4px; background:var(--ink); width:88px; margin-bottom:28px; }
  .eyebrow{
    font-weight:800; text-transform:uppercase; letter-spacing:.22em;
    color:var(--ink-muted); font-size:22px; display:flex; align-items:center; gap:14px;
  }
  .eyebrow .dot{ width:12px; height:12px; border-radius:50%; background:var(--accent); }
  .headline{
    font-weight:900; text-transform:uppercase; line-height:.95; letter-spacing:-.02em;
  }
  .og  .headline{ font-size:120px; }
  .sq  .headline{ font-size:132px; }
  .headline em{ text-transform:none; }
  .tagline{
    font-family:'Instrument Serif', Georgia, serif; font-style:italic;
    font-size:40px; color:var(--ink-muted); line-height:1.3;
  }
  .sq .tagline{ font-size:46px; }
  .tagline em{ color:var(--accent); }
  .foot{
    display:flex; align-items:center; justify-content:space-between;
    border-top:2px solid var(--line); padding-top:28px;
  }
  .brand{ display:flex; align-items:center; gap:18px; }
  .mark{
    width:64px; height:64px; border:3px solid var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-family:'Instrument Serif', Georgia, serif; font-style:italic; font-size:40px;
  }
  .brand b{ font-size:24px; font-weight:900; text-transform:uppercase; letter-spacing:.06em; }
  .brand small{ display:block; font-size:13px; font-weight:800; letter-spacing:.24em; color:var(--ink-muted); text-transform:uppercase; }
  .foot .free{ font-weight:800; font-size:20px; text-transform:uppercase; letter-spacing:.14em; color:var(--ink-muted); }
  .icon .mark{ width:180px; height:180px; border:none; font-size:110px; }
</style>
</head>
<body>
<div class="frame">
  <div class="card">
    <div class="top">
      <div class="rule"></div>
      <p class="eyebrow"><span class="dot"></span>India's Sharpest MBA Newsletter — Est. 2025</p>
    </div>
    <div>
      <h1 class="headline">MBA India<br><em>Daily.</em></h1>
      <p class="tagline">Understand the Economy. <em>Not Just the Headlines.</em></p>
    </div>
    <div class="foot">
      <div class="brand">
        <span class="mark">M</span>
        <span><b>MBA India Daily</b><small>Business Intelligence</small></span>
      </div>
      <span class="free">9 Domains · 15 Minutes · Free</span>
    </div>
  </div>
</div>
<script>
  // ?v=og | ?v=sq | ?v=icon
  var v = new URLSearchParams(location.search).get('v') || 'og';
  document.body.className = v;
  if (v === 'icon') {
    document.querySelector('.card').innerHTML = '<span class="mark">M</span>';
  }
  if (v === 'sq') {
    document.querySelector('.headline').innerHTML = 'MBA<br>India<br><em>Daily.</em>';
  }
</script>
</body>
</html>
